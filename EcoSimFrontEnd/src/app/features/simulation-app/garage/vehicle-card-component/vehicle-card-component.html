<div class="bg-white/90 border-t-2 border-black hover:border-[#00a19b] transition-all p-4 flex flex-col shadow-sm group">
  <div class="flex justify-between items-start mb-3">
    <span class="text-[9px] font-mono font-bold text-slate-400">#{{ vehicle.id }}</span>
    <div class="h-1.5 w-1.5 rounded-full bg-[#00a19b]"></div>
  </div>
  <div class="mb-5">
    <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-tighter leading-none">{{ vehicle.brand }}</h3>
    <p class="text-lg font-black italic uppercase text-black leading-tight">{{ vehicle.model }}</p>
  </div>
  <div class="grid grid-cols-2 gap-2 border-t border-black/5 pt-3 mt-auto">
    <div>
      <p class="text-[7px] font-bold text-slate-400 uppercase">Engine</p>
      <p class="text-[9px] font-black text-black">{{ vehicle.engineType }}</p>
    </div>
    <div class="text-right">
      <p class="text-[7px] font-bold text-slate-400 uppercase">Efficiency</p>
      <p class="text-[9px] font-black text-[#00a19b]">{{ vehicle.officialEfficiency }} L/100</p>
    </div>
  </div>
</div>
