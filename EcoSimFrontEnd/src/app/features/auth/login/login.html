<div class="min-h-screen w-full bg-[#f8fafc] flex items-center justify-center p-4 relative overflow-hidden selection:bg-[#ffcc00] font-sans">
  
  <div class="fixed inset-0 pointer-events-none border-[8px] border-black/5 z-50"></div>
  <div class="absolute inset-0 opacity-[0.03] z-0 pointer-events-none" 
       style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');"></div>

  <header class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-[60]">
    <div class="flex items-center gap-3">
      <div class="w-1 h-6 bg-[#00a19b]"></div>
      <h2 class="text-lg font-black italic uppercase text-black leading-none tracking-tighter">Eco<span class="text-[#00a19b]">SIM</span></h2>
    </div>
    <!-- <div class="hidden md:block text-[8px] font-mono text-black/30 uppercase tracking-[0.4em]">
      Node: Casablanca_Sector // Uptime: 100%
    </div> -->
  </header>

  <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 bg-white border-[3px] border-black shadow-[12px_12px_0px_0px_rgba(0,161,155,1)] relative z-10 overflow-hidden">
    
    <div class="hidden lg:block lg:col-span-5 relative bg-black overflow-hidden border-r-[3px] border-black">
      <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#00a19b]/20 to-transparent h-1/2 w-full animate-scan z-20 pointer-events-none"></div>
      <img src="assets/w15.jpg" class="w-full h-full object-cover grayscale brightness-50 contrast-125 scale-110">
      
      <div class="absolute bottom-8 left-8 z-30">
        <p class="text-[9px] font-black italic text-white uppercase tracking-wider opacity-60">
          Chassis_ID: W15-2026
        </p>
      </div>
    </div>

    <div class="lg:col-span-7 p-8 lg:p-12 bg-white flex flex-col justify-center">
      <div class="mb-8">
        <div class="bg-black text-[#00a19b] inline-block px-2 py-0.5 text-[8px] font-black uppercase tracking-widest mb-3">
          Auth_Required
        </div>
        <h1 class="text-4xl font-black italic uppercase text-black tracking-tighter leading-none">
          Login_<span class="text-[#00a19b]">HQ</span>
        </h1>
      </div>

      <form (submit)="$event.preventDefault(); onLogin()" class="space-y-5">
        <div class="space-y-1.5">
          <label class="text-[9px] font-black uppercase text-slate-400 italic tracking-widest">Pilot_ID</label>
          <input 
            [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
            type="email" 
            placeholder="PILOT@ECOSIM.SYSTEM"
            class="w-full bg-slate-50 border-2 border-black p-3 text-[11px] font-bold uppercase outline-none focus:bg-[#00a19b]/5 focus:border-[#00a19b] transition-all placeholder:opacity-20"
          >
        </div>

        <div class="space-y-1.5">
          <label class="text-[9px] font-black uppercase text-slate-400 italic tracking-widest">Access_Key</label>
          <input 
            [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
            type="password" 
            placeholder="••••••••"
            class="w-full bg-slate-50 border-2 border-black p-3 text-[11px] font-bold uppercase outline-none focus:bg-[#00a19b]/5 focus:border-[#00a19b] transition-all"
          >
        </div>

        @if (error()) {
          <div class="border-2 border-red-500 bg-red-50 text-red-600 text-[9px] font-black p-2 uppercase">
            ⚠️ Error: {{ error() }}
          </div>
        }

        <button 
          type="submit"
          [disabled]="isLoading()"
          class="w-full bg-black text-white font-black py-4 uppercase italic text-xs tracking-[0.4em] hover:bg-[#ffcc00] hover:text-black transition-all active:translate-y-0.5 disabled:opacity-50"
        >
          {{ isLoading() ? 'Warming...' : 'Start_Engine' }}
        </button>
      </form>

      <div class="mt-10 pt-6 border-t border-slate-100 flex justify-between items-center">
        <a routerLink="/register" class="text-[9px] font-black uppercase italic text-black border-b border-[#00a19b] hover:bg-[#00a19b] transition-all">
          Register
        </a>
        <span class="text-[8px] text-slate-300 font-mono italic">v3.0.1_SECURE</span>
      </div>
    </div>
  </div>

  <footer class="fixed bottom-0 left-0 w-full p-6 flex justify-between items-end z-[60]">
    <div class="text-[9px] font-bold uppercase italic text-black/40 flex gap-4">
      <a routerLink="/about" class="hover:text-black">About</a>
      <a routerLink="/contact" class="hover:text-black">Support</a>
    </div>
    <div class="text-right">
      <p class="text-[10px] font-black italic text-black uppercase tracking-tighter">2026</p>
    </div>
  </footer>
</div>
